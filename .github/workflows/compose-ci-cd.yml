name: Compose CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  deploy:
    name: Deploy to server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: wordpress-server-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy Compose and WordPress content files to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p wordpress-container"
          scp -r -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            docker-compose.yml wp-content \
            "$DEPLOY_USER@$DEPLOY_HOST:wordpress-container/"

      - name: Pull images and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd wordpress-container && docker compose --env-file .env pull && docker compose --env-file .env up -d --remove-orphans"
